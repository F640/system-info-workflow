name:  Windows 11 arm64 system information
on:
  workflow_dispatch:
    inputs:
      use-prerelease:
        default: false
        type: 'boolean'
        required: false

jobs:
  download-and-run:
    name: setup and run
    runs-on: windows-11-arm
    steps:
      - name: checkout repo
        uses: actions/checkout@v4
      - name: Setup Fastfetch
        uses: ./.github/workflows/fastfetch-base/windows-arm64
        with:
          use-prerelease: ${{ github.event.inputs.use-prerelease }}
      - name: Run Fastfetch
        shell: cmd
        run: '%cd%\fastfetch\fastfetch.exe -c all'
      - name: Get Current Full Windows Version
        shell: cmd
        run: ver
      - name: Run systeminfo
        shell: cmd
        run: systeminfo
      - name: Run Get-ComputerInfo
        shell: pwsh
        run: Get-ComputerInfo
      - name: Print environment variables (Command Prompt)
        shell: cmd
        run: set
      - name: Print environment variables (Powershell)
        shell: pwsh
        run: 'Get-ChildItem Env:'
      - name: Get network interfaces (ipconfig)
        shell: cmd
        run: ipconfig /all
      - name: Show running processes (tasklist)
        shell: cmd
        run: tasklist