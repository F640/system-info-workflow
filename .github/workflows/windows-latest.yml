name:  Windows latest system information
on:
  workflow_dispatch:
    inputs:
      fastfetch-use-prerelease:
        description: 'Fastfetch: Use pre-release version'
        default: false
        type: 'boolean'
        required: false

jobs:
  download-and-run:
    name: setup and run
    runs-on: windows-latest
    steps:
      - name: checkout repo
        uses: actions/checkout@v4
      - name: Setup Fastfetch
        uses: ./.github/workflows/fastfetch-base/windows-x86_64
        with:
          use-prerelease: ${{ github.event.inputs.fastfetch-use-prerelease }}
      - name: Run Fastfetch
        shell: cmd
        run: '%cd%\fastfetch\fastfetch.exe -c all'
      - name: Get Current Full Windows Version
        shell: cmd
        run: ver
      - name: Run systeminfo
        shell: cmd
        run: systeminfo
      - name: Run Get-ComputerInfo
        shell: pwsh
        run: Get-ComputerInfo
      - name: Print environment variables (Command Prompt)
        shell: cmd
        run: set
      - name: Print environment variables (Powershell)
        shell: pwsh
        run: 'Get-ChildItem Env:'
      - name: Get network interfaces (ipconfig)
        shell: cmd
        run: ipconfig /all
      - name: Show running processes (tasklist)
        shell: cmd
        run: tasklist